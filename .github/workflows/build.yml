name: Build Windows app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install pyinstaller==6.11.1 openpyxl==3.1.5

      - name: Test extraction against Chrome
        run: python test/test_app.py

      - name: Build SiebelTableExtractor.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name SiebelTableExtractor
          --icon app/icon.ico
          --add-data "app/js;js"
          --add-data "app/icon.ico;."
          --paths app
          app/main.py

      - name: Check the exe starts its bundled code
        shell: pwsh
        run: |
          if (!(Test-Path dist/SiebelTableExtractor.exe)) { throw "exe missing" }
          (Get-Item dist/SiebelTableExtractor.exe).Length / 1MB

      - uses: actions/upload-artifact@v4
        with:
          name: SiebelTableExtractor
          path: dist/SiebelTableExtractor.exe

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path app/version.py -Pattern '"(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publish release (pushes to main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Version ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/SiebelTableExtractor.exe
          body: |
            Download **SiebelTableExtractor.exe** below. See the README for how to use it.
