name: Test and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install openpyxl==3.1.5

      - name: Build the install page
        run: python build.py

      - name: Test the bookmark in Chrome
        run: python test/test_bookmark.py

      - name: Read version
        id: version
        shell: pwsh
        run: |
          "version=$((Get-Content VERSION).Trim())" >> $env:GITHUB_OUTPUT

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Version ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/Install-Extract-to-Excel.html
          body: |
            Download **Install-Extract-to-Excel.html** below, open it in Chrome and follow the steps on the page.
